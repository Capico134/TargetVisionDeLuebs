name: TargetVision Regression Tests

# Wann soll der Test starten? Bei jedem Push auf den Haupt-Branch!
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Repository auschecken
      uses: actions/checkout@v4

    - name: 🐍 Python einrichten
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Passe das an deine Python-Version an

    - name: 📦 Abhängigkeiten installieren
      run: |
        python -m pip install --upgrade pip
        # WICHTIG: Wir nutzen die 'headless' Version von OpenCV für Linux-Server ohne Monitor!
        pip install numpy opencv-python-headless configparser

    - name: 🚀 Regression-Tests ausführen
      run: python run_tests.py

    - name: 💾 Test-Report archivieren
      uses: actions/upload-artifact@v4
      if: always() # Lädt den Report hoch, selbst wenn ein Test fehlschlägt
      with:
        name: test-report
        path: test_report.txt